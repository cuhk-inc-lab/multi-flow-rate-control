# Configurable multi-stream wire stress test (Node1/2/3/4 lab topology).
# Run from Node1:
#   ./scripts/run_wire_stress.sh scripts/examples/stress_lab.yaml
#
# This recipe (6 streams):
#   1→4 10Mbps, 2→4 10Mbps, 1→2 20Mbps, 2→2 20Mbps, 1→3 10Mbps, 1→4 20Mbps
#
# Rules:
# - One wg_multi_pipeline process = one codec (runner auto-groups).
# - Same (to, codec) share one UDP listen port / receiver process.
# - Max 8 flows per receiver process.
# - file paths are on the *sender* host (local path for ssh: local;
#   remote senders: file is scp'd from Node1 if the path exists locally).

nodes:
  node1:
    ssh: local
    ip: 10.10.12.1
  node2:
    ssh: fyp1@10.10.10.162
    ip: 10.10.12.2
    monitor_ifaces: "ap0 station1"
  node3:
    ssh: fyp1@10.10.10.163
    ip: 10.10.23.2
    monitor_ifaces: "ap1 station2"
  node4:
    ssh: fyp1@10.10.10.164
    ip: 10.10.34.2

defaults:
  idle_sec: 20
  port_base: 9200
  monitor: true
  keep_remote_output: true
  remote_repo: ~/work/multi-flow-rate-control

streams:
  # id = wire flow_id within each (to, codec) receiver (0..7).
  # node4 receives three copy flows → ids 0,1,2 must be unique there.

  # 1→4 @ 10 Mbps
  - id: 0
    from: node1
    to: node4
    file: te.mp4
    rate_mbps: 10
    codec: copy

  # 2→4 @ 10 Mbps
  - id: 1
    from: node2
    to: node4
    file: te.mp4
    rate_mbps: 10
    codec: copy

  # 1→2 @ 20 Mbps
  - id: 0
    from: node1
    to: node2
    file: te.mp4
    rate_mbps: 20
    codec: copy

  # 2→2 @ 20 Mbps (loopback on node2)
  - id: 1
    from: node2
    to: node2
    file: te.mp4
    rate_mbps: 20
    codec: copy

  # 1→3 @ 10 Mbps
  - id: 0
    from: node1
    to: node3
    file: te.mp4
    rate_mbps: 10
    codec: copy

  # 1→4 @ 20 Mbps
  - id: 2
    from: node1
    to: node4
    file: te.mp4
    rate_mbps: 20
    codec: copy
